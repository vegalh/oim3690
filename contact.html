<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      background: #f4f4f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #2b2b2b;
    }

    .contact-form {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.6rem;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 16px;
    }

    .hint {
      font-size: 0.75rem;
      color: #777;
      margin: 2px 0 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus,
    textarea:focus {
      outline: 3px solid #6c63ff55;
      border-color: #6c63ff;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-field label {
      margin: 0;
      font-weight: normal;
    }

    .checkbox-field input {
      width: auto;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #6c63ff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #564fd8;
    }

    button:focus {
      outline: 3px solid #6c63ff55;
    }
  </style>
</head>
<body>
  <main class="contact-form">
    <h1>Contact Me</h1>

    <form action="https://oim.zhili.dev/echo/view" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9 ()+-]*" aria-describedby="phone-hint">
        <p class="hint" id="phone-hint">Digits, spaces, and +()- only.</p>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to updates</label>
      </div>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
