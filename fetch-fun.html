<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Something Fun</title>
</head>
<body>
  <h1>Fetch Something Fun</h1>
  <p>How warm is it near Peninsula Montessori in Newton right now?</p>
  <button id="fetchBtn">Get the temperature</button>
  <p id="result" aria-live="polite"></p>

  <script>
    const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=42.33&longitude=-71.21&current=temperature_2m&temperature_unit=fahrenheit';

    const fetchBtn = document.querySelector('#fetchBtn');
    const result = document.querySelector('#result');

    fetchBtn.addEventListener('click', async () => {
      result.textContent = 'Loading...';
      try {
        const response = await fetch(WEATHER_URL);
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const data = await response.json();
        result.textContent = `It is ${data.current.temperature_2m}°F right now.`;
      } catch (error) {
        console.error(error);
        result.textContent = 'Could not get the temperature. Please try again.';
      }
    });
  </script>
</body>
</html>
