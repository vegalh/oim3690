<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Board</title>
</head>
<body>
  <h1>Message Board</h1>
  <label for="message">Your message</label>
  <input id="message" type="text" size="40">
  <button id="postBtn">Post</button>
  <p id="status" aria-live="polite"></p>

  <script>
    async function postMessage(text) {
      const response = await fetch('https://oim.zhili.dev/message', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          // The course uses your GitHub username as the token.
          'X-Token': 'vegalh'
        },
        body: JSON.stringify({ message: text })
      });
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      return response.json();
    }

    const messageInput = document.querySelector('#message');
    const postBtn = document.querySelector('#postBtn');
    const status = document.querySelector('#status');

    postBtn.addEventListener('click', async () => {
      const text = messageInput.value.trim();
      if (!text) {
        status.textContent = 'Type a message first.';
        return;
      }
      postBtn.disabled = true;
      status.textContent = 'Posting...';
      try {
        await postMessage(text);
        status.textContent = `Posted: ${text}`;
        messageInput.value = '';
      } catch (error) {
        console.error(error);
        status.textContent = 'Could not post your message. Please try again.';
      }
      postBtn.disabled = false;
    });
  </script>
</body>
</html>
