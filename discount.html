<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Discount</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      background: #f4f4f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #2b2b2b;
    }

    .discount-app {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.4rem;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .field {
      margin-bottom: 16px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #6c63ff;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checkbox-field input {
      width: 18px;
      height: 18px;
    }

    .checkbox-field label {
      margin: 0;
      font-size: 0.95rem;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #6c63ff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    #result {
      margin-top: 16px;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="discount-app">
    <h1>Member Discount</h1>

    <div class="field">
      <label for="total-input">Cart Total ($)</label>
      <input type="number" id="total-input" placeholder="Enter cart total" min="0" step="0.01">
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="member-input">
      <label for="member-input">I'm a member</label>
    </div>

    <button type="button" id="calc-btn">Calculate Discount</button>

    <p id="result"></p>
  </main>

  <script>
    const totalInput = document.getElementById('total-input');
    const memberInput = document.getElementById('member-input');
    const calcBtn = document.getElementById('calc-btn');
    const result = document.getElementById('result');

    // total >= 100 AND a member -> 20% discount
    // total >= 100 OR a member -> 10% discount
    // Otherwise -> 0% discount
    function getDiscount(total, isMember) {
      if (total >= 100 && isMember) {
        return 0.20;
      } else if (total >= 100 || isMember) {
        return 0.10;
      } else {
        return 0;
      }
    }

    calcBtn.addEventListener('click', function () {
      const total = Number(totalInput.value);
      const isMember = memberInput.checked;
      const rate = getDiscount(total, isMember);
      const discountAmount = total * rate;
      const finalTotal = total - discountAmount;

      result.textContent =
        (rate * 100) + '% discount (-$' + discountAmount.toFixed(2) + ') \u2014 ' +
        'Final total: $' + finalTotal.toFixed(2);
    });
  </script>
</body>
</html>
