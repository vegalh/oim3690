<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Professor's Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #12101f;
      --dusk: #2a2145;
      --gold: #d9b45b;
      --gold-light: #f0d98f;
      --parchment: #f3e6c8;
      --ink: #33261a;
      --moon: #e9e4d4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      background: radial-gradient(circle at 50% 0%, var(--dusk), var(--night) 70%) var(--night);
      color: var(--moon);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 20px;
      line-height: 1.5;
    }

    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 32px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      background: rgba(18, 16, 31, 0.75);
      box-shadow: 0 0 40px rgba(217, 180, 91, 0.15);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--gold-light);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 32px;
      line-height: 1.2;
      text-align: center;
    }

    .tagline {
      margin: 0 0 24px;
      font-style: italic;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-light);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: var(--parchment);
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: var(--night);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: var(--gold-light);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 2px;
    }

    #answer {
      margin: 24px 0 0;
      padding: 20px;
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      background: var(--parchment);
      color: var(--ink);
      white-space: pre-wrap;
    }

    /* Keeps the parchment hidden until there is something on it. */
    #answer:empty {
      display: none;
    }

    main {
      position: relative;
      z-index: 1;
    }

    /* The thin second line that makes the card border look engraved. */
    main::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(217, 180, 91, 0.4);
      border-radius: 8px;
      pointer-events: none;
    }

    h1 {
      background: linear-gradient(90deg, var(--gold), var(--gold-light), #fff6d5, var(--gold-light), var(--gold));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
    }

    .divider {
      margin: -12px 0 20px;
      color: var(--gold);
      letter-spacing: 12px;
      text-align: center;
    }

    #sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: var(--moon);
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .moon {
      position: fixed;
      top: 40px;
      right: 6%;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      box-shadow: 18px 8px 0 0 var(--gold-light);
      filter: drop-shadow(0 0 14px rgba(240, 217, 143, 0.6));
      pointer-events: none;
    }

    button {
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      box-shadow: 0 4px 18px rgba(217, 180, 91, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      background: linear-gradient(180deg, #fff6d5, var(--gold-light));
      box-shadow: 0 6px 26px rgba(240, 217, 143, 0.55);
      transform: translateY(-2px);
    }

    button:disabled {
      animation: glow 1.2s ease-in-out infinite alternate;
      transform: none;
    }

    #answer {
      position: relative;
      padding-bottom: 32px;
      background: radial-gradient(circle at 50% 40%, var(--parchment) 60%, #e3cfa0);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      transform-origin: top;
      animation: unfurl 0.5s ease-out;
    }

    /* The wax seal in the corner of the parchment. */
    #answer::after {
      content: '✦';
      position: absolute;
      right: -10px;
      bottom: -10px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8453c, #6f1d1b);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      color: var(--gold-light);
    }

    .spark {
      position: fixed;
      z-index: 2;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 8px var(--gold-light);
      pointer-events: none;
      animation: spark 0.8s ease-out forwards;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    @keyframes twinkle {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }

    @keyframes glow {
      from { box-shadow: 0 0 6px rgba(217, 180, 91, 0.3); }
      to { box-shadow: 0 0 26px rgba(240, 217, 143, 0.9); }
    }

    @keyframes unfurl {
      from { opacity: 0; transform: scaleY(0.4); }
      to { opacity: 1; transform: scaleY(1); }
    }

    @keyframes spark {
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Below this width the moon would slide behind the card. */
    @media (max-width: 900px) {
      .moon {
        display: none;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }

      main {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <main>
    <h1>The Professor's Study</h1>
    <p class="tagline">Report your tasks. Points shall be awarded, or taken away.</p>
    <p class="divider" aria-hidden="true">✦☾✦</p>
    <label for="prompt">What have you finished, and what have you not?</label>
    <textarea id="prompt" placeholder="Be honest. The Professor always knows..."></textarea>
    <button id="askBtn">Send Your Owl</button>
    <p id="answer" aria-live="polite"></p>
  </main>

  <script>
    // This page works only on your vercel.app link. Live Server and GitHub Pages
    // cannot run the function in api/ask.js, so there the Ask button fails.

    // Sends your prompt to your own function at /api/ask. The function adds the
    // key and calls the model, so no key appears anywhere on this page.
    async function askAI(prompt) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      const data = await response.json();
      // A model that reasons first puts a reasoning item ahead of the answer,
      // so find the item of type message, then read its text.
      const message = data.output.find(item => item.type === 'message');
      return message.content[0].text;
    }

    const askBtn = document.querySelector('#askBtn');
    const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Scatters stars across the sky, each with its own size and twinkle timing.
    const sky = document.querySelector('#sky');
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('span');
      const size = 1 + Math.random() * 2;
      star.className = 'star';
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 3}s`;
      sky.appendChild(star);
    }

    // Throws a burst of gold sparks out from the middle of the button.
    function castSparks() {
      if (calmMotion) return;
      const box = askBtn.getBoundingClientRect();
      for (let i = 0; i < 24; i++) {
        const spark = document.createElement('span');
        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 120;
        spark.className = 'spark';
        spark.style.left = `${box.left + box.width / 2}px`;
        spark.style.top = `${box.top + box.height / 2}px`;
        spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        spark.addEventListener('animationend', () => spark.remove());
        document.body.appendChild(spark);
      }
    }

    askBtn.addEventListener('click', async () => {
      castSparks();
      const prompt = document.querySelector('#prompt').value;
      const answerEl = document.querySelector('#answer');
      // Turn the button off until the answer arrives, so a second click
      // cannot send, and pay for, a second request.
      askBtn.disabled = true;
      // A call takes a few seconds, so show something while you wait.
      answerEl.textContent = 'Your owl is on its way...';
      try {
        // textContent shows the answer as plain text. innerHTML would run any
        // HTML the model wrote.
        answerEl.textContent = await askAI(prompt);
      } catch (error) {
        answerEl.textContent = 'Error: ' + error.message;
      } finally {
        // finally runs whether the call worked or failed.
        askBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
