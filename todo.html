<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>
  <main class="todo-app">
    <h1>To-Do List</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="active">Active</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="todo-footer">
      <span id="items-left">0 items left</span>
      <button type="button" id="clear-completed">Clear completed</button>
    </div>
  </main>

  <script src="js/todo.js"></script>
</body>
</html>
